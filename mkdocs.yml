# MkDocs configuration for the Event-Triggered Analysis documentation.
#
# The markdown lives in ./Docs (see docs_dir below). Built and deployed by
# .github/workflows/release.yml on a version tag; built without deploying by
# .github/workflows/build-and-test.yml.

site_name: Event-Triggered Analysis
site_description: >-
  Open Ephys GUI plugins for analysing continuous data in windows locked to an
  event: triggered averages, power, coherence and receptive-field maps.
site_author: Joscha Schmiedt
site_url: https://brain-bremen.github.io/event-triggered-analysis/

repo_url: https://github.com/brain-bremen/event-triggered-analysis
repo_name: brain-bremen/event-triggered-analysis
edit_uri: edit/main/Docs/

copyright: Copyright &copy; 2025–2026 Joscha Schmiedt, Universität Bremen — GPL-3.0-or-later

docs_dir: Docs
site_dir: Build/site

# Not pages: the screenshot note and the uv project that builds this site.
# (Docs/.venv needs no entry — dot-directories are already ignored.)
exclude_docs: |
  assets/screenshots/README.md
  pyproject.toml
  uv.lock

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brain-bremen/event-triggered-analysis
      name: The repository

extra_css:
  - assets/extra.css

# Warnings become errors, so a dead link or a missing screenshot fails the build.
strict: true

# Anchors are checked too, not only page paths.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - Triggers and messages: triggers.md
  - Plugins:
      - plugins/index.md
      - Triggered Average: plugins/triggered-average.md
      - Triggered Power: plugins/triggered-power.md
      - Triggered Coherence: plugins/triggered-coherence.md
      - Receptive Field Bar Mapper: plugins/receptive-field-mapper.md
  - Parameter reference:
      - reference/index.md
      - Shared capture parameters: reference/capture.md
      - Triggered Average: reference/triggered-average.md
      - Spectral (Power & Coherence): reference/spectral.md
      - Receptive Field Bar Mapper: reference/receptive-field.md
  - Saved sessions:
      - sessions/index.md
      - Format: sessions/format.md
      - Loading in Python: sessions/python.md
      - Loading in MATLAB: sessions/matlab.md
  - Changelog: changelog.md
  - Development: development.md
