name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  # Manual runs deploy the documentation only. Every build/release job below is
  # guarded on the ref being a tag, so dispatching from a branch republishes the
  # site without inventing a release for it.
  workflow_dispatch:

# GitHub Pages allows one deployment at a time. Queue rather than cancel: a
# release deploy that loses a race to a doc fix would leave the site describing
# the previous version.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PLUGIN_GUI_VERSION: "v1.0.2"

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: plugin
          submodules: recursive

      - name: Checkout Open Ephys GUI
        uses: actions/checkout@v4
        with:
          repository: open-ephys/plugin-GUI
          ref: ${{ env.PLUGIN_GUI_VERSION }}
          path: plugin-GUI
          submodules: recursive

      # The runner image ships CMake 3.31.x, which predates the
      # "Visual Studio 18 2026" generator (added in CMake 4.2.3).
      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Cache GUI dependencies
        uses: actions/cache@v4
        with:
          path: |
            plugin-GUI/Build
            plugin-GUI/installed_libs
          key: ${{ runner.os }}-gui-${{ github.repository }}-${{ hashFiles('plugin-GUI/CMakeLists.txt') }}-Release
          restore-keys: |
            ${{ runner.os }}-gui-${{ github.repository }}-

      # A cached CMake build tree is bound to the absolute path it was configured
      # at, and the workspace path contains the repository name. Renaming the
      # repository therefore invalidated every cached GUI build: the restore-keys
      # fallback happily restored a tree configured under .../TriggeredSpectra/,
      # and `cmake -B Build` refused it. Scoping the key to github.repository
      # stops a cache surviving the next rename; this step is the backstop for
      # any other way the path can change, turning a red job into a slow one.
      - name: Discard a GUI build tree configured elsewhere
        shell: bash
        run: |
          cache=plugin-GUI/Build/CMakeCache.txt
          # CMake writes forward slashes into the cache even on Windows, where
          # GITHUB_WORKSPACE has backslashes; normalise before comparing.
          workspace=$(printf '%s' "$GITHUB_WORKSPACE" | tr '\\' '/')
          expected="$workspace/plugin-GUI"

          if [ -f "$cache" ] && ! grep -qF "CMAKE_HOME_DIRECTORY:INTERNAL=$expected" "$cache"; then
            echo "Cached GUI build tree was configured for another path; discarding it."
            grep -F CMAKE_HOME_DIRECTORY "$cache" || true
            rm -rf plugin-GUI/Build
          fi

      - name: Configure Open Ephys GUI
        run: |
          cd plugin-GUI
          cmake -B Build -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTS=OFF

      - name: Build Open Ephys GUI
        run: |
          cd plugin-GUI
          cmake --build Build --config Release -j4

      - name: Configure plugin
        run: |
          cd plugin
          cmake -B Build -G "Visual Studio 18 2026" -A x64 -DGUI_BASE_DIR="${{ github.workspace }}/plugin-GUI" -DBUILD_TESTS=OFF

      - name: Build plugin
        run: |
          cd plugin
          cmake --build Build --config Release -j4

      - name: Upload Windows DLL
        uses: actions/upload-artifact@v4
        with:
          name: plugins-windows
          path: |
            plugin/Build/Release/TriggeredPower.dll
            plugin/Build/Release/TriggeredCoherence.dll
            plugin/Build/Release/TriggeredAverage.dll
          if-no-files-found: error

  build-linux:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: plugin
          submodules: recursive

      - name: Checkout Open Ephys GUI
        uses: actions/checkout@v4
        with:
          repository: open-ephys/plugin-GUI
          ref: ${{ env.PLUGIN_GUI_VERSION }}
          path: plugin-GUI
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libasound2-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Cache GUI dependencies
        uses: actions/cache@v4
        with:
          path: |
            plugin-GUI/Build
            plugin-GUI/installed_libs
          key: ${{ runner.os }}-gui-${{ github.repository }}-${{ hashFiles('plugin-GUI/CMakeLists.txt') }}-Release
          restore-keys: |
            ${{ runner.os }}-gui-${{ github.repository }}-

      # A cached CMake build tree is bound to the absolute path it was configured
      # at, and the workspace path contains the repository name. Renaming the
      # repository therefore invalidated every cached GUI build: the restore-keys
      # fallback happily restored a tree configured under .../TriggeredSpectra/,
      # and `cmake -B Build` refused it. Scoping the key to github.repository
      # stops a cache surviving the next rename; this step is the backstop for
      # any other way the path can change, turning a red job into a slow one.
      - name: Discard a GUI build tree configured elsewhere
        shell: bash
        run: |
          cache=plugin-GUI/Build/CMakeCache.txt
          # CMake writes forward slashes into the cache even on Windows, where
          # GITHUB_WORKSPACE has backslashes; normalise before comparing.
          workspace=$(printf '%s' "$GITHUB_WORKSPACE" | tr '\\' '/')
          expected="$workspace/plugin-GUI"

          if [ -f "$cache" ] && ! grep -qF "CMAKE_HOME_DIRECTORY:INTERNAL=$expected" "$cache"; then
            echo "Cached GUI build tree was configured for another path; discarding it."
            grep -F CMAKE_HOME_DIRECTORY "$cache" || true
            rm -rf plugin-GUI/Build
          fi

      - name: Configure Open Ephys GUI
        run: |
          cd plugin-GUI
          cmake -B Build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      - name: Build Open Ephys GUI
        run: |
          cd plugin-GUI
          cmake --build Build --config Release -j$(nproc)

      - name: Configure plugin
        run: |
          cd plugin
          cmake -B Build -DCMAKE_BUILD_TYPE=Release -DGUI_BASE_DIR="${{ github.workspace }}/plugin-GUI" -DBUILD_TESTS=OFF

      - name: Build plugin
        run: |
          cd plugin
          cmake --build Build --config Release -j$(nproc)

      - name: Upload Linux SO
        uses: actions/upload-artifact@v4
        with:
          name: plugins-linux
          path: |
            plugin/Build/TriggeredPower.so
            plugin/Build/TriggeredCoherence.so
            plugin/Build/TriggeredAverage.so
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: plugins-windows
          path: ./artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: plugins-linux
          path: ./artifacts/linux

      - name: Create release archives
        run: |
          cd artifacts/windows
          zip -j ../../event-triggered-analysis-windows-${{ github.ref_name }}.zip *.dll
          cd ../linux
          tar -czf ../../event-triggered-analysis-linux-${{ github.ref_name }}.tar.gz *.so
          cd ../..

      - name: Extract release notes
        id: extract-notes
        run: |
          # Extract release notes from the changelog if it exists. It lives in
          # Docs/ and is published as a page of the documentation site; the file
          # at the repository root is only a pointer to it.
          CHANGELOG=Docs/changelog.md

          if [ -f "$CHANGELOG" ]; then
            # Try to extract notes for this version
            TAG_VERSION="${{ github.ref_name }}"
            VERSION="${TAG_VERSION#v}"

            # Look for version header in CHANGELOG
            awk "/## \[${VERSION}\]|## ${VERSION}/,/## \[|## [0-9]/" "$CHANGELOG" | sed '1d;$d' > release_notes.txt

            # If empty, use a default message
            if [ ! -s release_notes.txt ]; then
              echo "Release ${{ github.ref_name }}" > release_notes.txt
              echo "" >> release_notes.txt
              echo "See [the changelog](https://brain-bremen.github.io/event-triggered-analysis/changelog/) for details." >> release_notes.txt
            fi
          else
            echo "Release ${{ github.ref_name }}" > release_notes.txt
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            event-triggered-analysis-windows-${{ github.ref_name }}.zip
            event-triggered-analysis-linux-${{ github.ref_name }}.tar.gz
          body: ${{ steps.extract-notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Documentation -------------------------------------------------------
  #
  # Deliberately not gated on a tag, and deliberately not `needs:` the build
  # jobs. The site describes the plugins rather than shipping them, so a manual
  # dispatch republishes it without a release, and a compiler failure on one
  # platform does not keep a documentation fix off the site.
  #
  # GitHub Pages is configured with "GitHub Actions" as its source, so the site
  # is uploaded as an artifact here and published by deploy-pages below rather
  # than committed to a gh-pages branch.
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The docs toolchain is a uv project in Docs/, pinned by Docs/uv.lock, so
      # CI builds the site with exactly the versions that were reviewed locally.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: Docs/uv.lock

      # mkdocs.yml sets strict: true, so a dead link, a missing page or a
      # screenshot that was never added fails here rather than reaching the site.
      - name: Build the site
        run: uv run --project Docs --locked mkdocs build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Build/site

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
